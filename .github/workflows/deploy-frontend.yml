name: Deploy Frontend to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: v2_engine/frontend_v2/package-lock.json

      - name: Install dependencies
        working-directory: v2_engine/frontend_v2
        run: npm ci

      - name: Build
        working-directory: v2_engine/frontend_v2
        env:
          VITE_API_BASE: ${{ secrets.VITE_API_BASE }}
          VITE_CESIUM_TOKEN: ${{ secrets.VITE_CESIUM_TOKEN }}
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: v2_engine/frontend_v2/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
