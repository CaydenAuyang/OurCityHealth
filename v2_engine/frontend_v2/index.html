<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Our City Health — Iron Man HUD</title>
    <meta name="description" content="Geospatial Civic Intelligence Platform" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Set CESIUM_BASE_URL before any module scripts load.
      // On GitHub Pages the app is served from a sub-path, so Cesium's
      // workers and imagery assets must use that same sub-path prefix.
      (function() {
        var base = window.location.pathname.startsWith('/Our-City-Health---Sentiment-Project/')
          ? '/Our-City-Health---Sentiment-Project/'
          : '/';
        window.CESIUM_BASE_URL = base + 'cesium/';
      })();
    </script>
    <script>
      // GitHub Pages SPA redirect handler — decode the 404.html redirect
      (function(l) {
        if (l.search[1] === '/') {
          var decoded = l.search.slice(1).split('&').map(function(s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body>
    <!-- Diagnostic: visible before JS runs. React will hide this on mount. -->
    <div id="pre-js-indicator" style="
      position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
      color:#00d4ff; font-family:monospace; font-size:1rem;
      text-align:center; pointer-events:none; z-index:9999;
    ">
      <div>⏳ Loading app…</div>
      <div style="font-size:0.7rem;color:#666;margin-top:0.5rem;">
        If this never disappears, open DevTools (F12) → Console
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
